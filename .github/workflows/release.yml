# Modified by JazzMasterT, 2026-11: builds, tests and releases Kurzhaar (the platform tests still with Dinghy's app).
# Kurzhaar: build on GitHub, run the platform's and Kurzhaar's host tests, and on a tag vX.Y publish the release with a build
# attestation (actions/attest-build-provenance): the Firmware Hub shows "Built from source" for exactly these files.
# The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com, as in
# sloopDX's and OberVave's workflows. Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow numpy scipy

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: The platform, with Dinghy's app (the SMK-37 first, the FM-1 last, as its tests expect)
        env:
          DINGHY_APP: dinghy
        run: |
          BOARD=smk37 sh build.sh
          BOARD=smk37 MODEL=elite sh build.sh
          BOARD=smk37 MODEL=mke sh build.sh
          sh build.sh
          sh tests/run_tests.sh

      - name: Kurzhaar (FM-1)
        run: |
          sh build.sh
          sh tests/run_kurzhaar_tests.sh

      - name: Release packages (tags only)
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          sh build.sh --release "$V"
          ls -l build/kurzhaar-"$V".fwsc
          (cd build && sha256sum kurzhaar-"$V".fwsc > SHA256SUMS)
          cp assets/JieLi-AC79-SDK-LICENSE.txt build/   # the package carries three SDK files (Apache-2.0)
          cp LICENSE build/LICENSE-GPL-3.0.txt && cp LICENSING.md build/   # the GPL travels with the firmware; the credits

      - uses: actions/upload-artifact@v4
        with:
          name: kurzhaar-fwsc
          path: build/kurzhaar*.fwsc
          if-no-files-found: error

      - name: Attest the packages (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/kurzhaar-[0-9]*.fwsc

      # (the release build only, not the dev one: kurzhaar.fwsc – no comment inside the block below: it would be part of the pattern)
      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/kurzhaar-[0-9]*.fwsc
            build/SHA256SUMS
            build/JieLi-AC79-SDK-LICENSE.txt
            build/LICENSE-GPL-3.0.txt
            build/LICENSING.md
          generate_release_notes: true
